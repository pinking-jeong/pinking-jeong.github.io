    { en: "SLICE", ko: "댕강 자르기", it: "cut clean,", d: 5.0,

  ];
  const JAMO28 = [..."ㄱㅋㆁㄷㅌㄴㅂㅍㅁㅈㅊㅅㆆㅎㅇㄹㅿㆍㅡㅣㅗㅏㅜㅓㅛㅑㅠㅕ"];

  document.getElementById("sr").textContent = SCENES.map((s) =>

  const cv = document.getElementById("c");
  const ctx = cv.getContext("2d");

  const [L, lx] = mk();          // 장면 글자 층(퇴장 블러용)

  const [M, mx] = mk(); let mKey = null; // 낙서를 오려 낼 글자 모양
  const S = document.createElement("canvas"); const sx = S.getContext("2d", { willReadFrequently: true });

  const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));

  const easeOut = (p) => 1 - Math.pow(1 - p, 3);
  const easeOutExpo = (p) => (p >= 1 ? 1 : 1 - Math.pow(2, -10 * p));

  const fK = (wt, size) => `${Math.round(wt)} ${size}px ${KR}`;

  const seg = new Intl.Segmenter("ko", { granularity: "grapheme" });
  function parse(str) {

      out.push({ t: g[i], ruby: "" });
    }
    return out;
  }
  function unitW(c, u, size, wt) {

    if (u.ruby) { c.font = fK(wt, size * 0.42); w += c.measureText(u.ruby).width + size * 0.03; }
    return { mw, w };
  }
  function drawUnit(c, u, x, y, size, wt) {
    if (u.t === " ") return;
    c.font = fK(wt, size); c.fillText(u.t, x, y);
    if (u.ruby) { c.font = fK(wt, size * 0.42); c.fillText(u.ruby, x + u.mw * (size / u.size) + size * 0.03, y); }

  function lineW(units, size, wt) { return units.reduce((a, u) => a + unitW(ctx, u, size, wt).w, 0); }

    });

  }

  // 장면 배치 계산
  const IT_Y = 500;

    // 움직임 줄이기: 장면마다 완성된 모습만 바꿔 보여 줌
    let i = 0;
    const show = () => { frame(START[i] + SCENES[i].d - 0.6); setTimeout(() => { i = (i + 1) % SCENES.length; show(); }, SCENES[i].d * 1000); };
    show(); return;
  }
  const first = 1.6; let t0 = null;
  frame(first);
  const loop = (now) => { if (t0 === null) t0 = now; frame(first + (now - t0) / 1000); requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
})();
</script>
